<main id="main-content" class="mx-auto max-w-4xl px-4 py-10" dir="rtl">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-sm font-semibold text-primary-foreground">אזור אישי</p>
      <app-heading
        class="mt-1 block"
        [text]="'שלום, ' + (auth.user()?.firstName ?? '')"
        level="1"
        size="page"
      />
      <p class="mt-2 text-text-muted">פרטים אלו ישמשו למילוי אוטומטי בהרשמות עתידיות.</p>
    </div>
    <app-button text="התנתקות" variant="secondary" size="small" (pressed)="logout()" />
  </div>

  <section class="mt-8 rounded-2xl border border-border bg-surface p-6">
    <app-heading text="הפרופיל שלי" level="2" />
    <form class="mt-5 grid gap-4 sm:grid-cols-2" [formGroup]="form" (ngSubmit)="save()">
      <app-form-field label="שם פרטי"
        ><input
          appFormControl
          formControlName="firstName"
          autocomplete="given-name"
          [attr.aria-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched"
      /></app-form-field>
      <app-form-field label="שם משפחה"
        ><input
          appFormControl
          formControlName="lastName"
          autocomplete="family-name"
          [attr.aria-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched"
      /></app-form-field>
      <app-form-field label="טלפון"
        ><input appFormControl formControlName="phone" type="tel" autocomplete="tel"
      /></app-form-field>
      <app-form-field label="תעודת זהות"
        ><input appFormControl formControlName="idNumber" autocomplete="off"
      /></app-form-field>
      @if (form.invalid && (form.controls.firstName.touched || form.controls.lastName.touched)) {
        <p
          class="sm:col-span-2 rounded-lg border border-danger bg-accent p-3 text-sm text-accent-foreground"
          role="alert"
        >
          יש למלא שם פרטי ושם משפחה.
        </p>
      }
      <div class="sm:col-span-2 flex items-center gap-4">
        <app-button
          text="שמירת פרטים"
          buttonType="submit"
          [disabled]="isSaving()"
          [busy]="isSaving()"
        />
        @if (saved()) {
          <p class="text-sm text-primary-foreground" role="status">הפרטים נשמרו.</p>
        }
      </div>
    </form>
  </section>
</main>
