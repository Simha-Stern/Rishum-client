<a class="flex h-full flex-col overflow-hidden rounded-2xl border border-border bg-surface shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" [routerLink]="['/institutions', institution().id, 'register']">
  <div class="flex h-40 items-center justify-center bg-surface-muted p-6">
    <img
      [ngSrc]="institution().logoUrl"
      [alt]="'הלוגו של ' + institution().name"
      width="160"
      height="96"
      class="max-h-24 w-auto object-contain"
    />
  </div>

  <div class="flex flex-1 flex-col gap-2 p-5">
    <h2 class="text-xl font-bold text-text">{{ institution().name }}</h2>
    <address class="mt-auto not-italic text-text-muted">
      {{ institution().address }}, {{ institution().city }}
    </address>
  </div>
</a>
