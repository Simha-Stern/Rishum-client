<main
  id="main-content"
  class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10"
  dir="rtl"
>
  <section class="w-full rounded-2xl border border-border bg-surface p-6 shadow-sm">
    <app-heading text="כניסה לחשבון" level="1" size="subsection" />
    <p class="mt-2 text-text-muted">היכנסו כדי לנהל את הפרופיל וההרשמות שלכם.</p>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <app-form-field label="אימייל"
        ><input
          appFormControl
          formControlName="email"
          type="email"
          autocomplete="email"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
      /></app-form-field>
      <app-form-field label="סיסמה"
        ><input
          appFormControl
          formControlName="password"
          type="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
      /></app-form-field>
      @if (form.invalid && (form.controls.email.touched || form.controls.password.touched)) {
        <p
          class="rounded-lg border border-danger bg-accent p-3 text-sm text-accent-foreground"
          role="alert"
        >
          יש להזין כתובת אימייל וסיסמה תקינים.
        </p>
      }
      @if (errorMessage(); as error) {
        <p
          class="rounded-lg border border-danger bg-accent p-3 text-sm text-accent-foreground"
          role="alert"
        >
          {{ error }}
        </p>
      }
      <app-button
        [text]="isSubmitting() ? 'מתחבר…' : 'כניסה'"
        buttonType="submit"
        [disabled]="isSubmitting()"
        [busy]="isSubmitting()"
        [fullWidth]="true"
      />
    </form>
    <p class="mt-5 text-sm text-text-muted">
      עדיין אין חשבון?
      <app-link text="יצירת חשבון" routerLink="/register" [queryParams]="{ returnUrl }" />
    </p>
  </section>
</main>
