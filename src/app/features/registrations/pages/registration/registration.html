<main id="main-content" class="mx-auto max-w-2xl px-4 py-10" dir="rtl">
  @if (registrationForm(); as data) {
    <p class="text-sm font-semibold text-primary-foreground">הרשמה מקוונת</p>
    <h1 class="mt-1 text-3xl font-bold text-text">{{ data.flow.name }}</h1>
    <p class="mt-2 text-text-muted">פרטים שמורים מהפרופיל שלך כבר מולאו. אפשר לעדכן לפני השליחה.</p>
    <form class="mt-6 space-y-5 rounded-2xl border border-border bg-surface p-6" [formGroup]="form" (ngSubmit)="submit()">
      @for (field of data.fields; track field.id) {
        <label class="block text-sm font-medium text-text">
          {{ field.label }} @if (field.required) { <span class="text-danger" aria-label="שדה חובה">*</span> }
          @switch (field.type) {
            @case ('textarea') { <textarea class="mt-1 min-h-28 w-full rounded-lg border border-border px-3 py-2" [formControlName]="field.key" [attr.aria-invalid]="form.controls[field.key].invalid && form.controls[field.key].touched" [attr.aria-describedby]="form.controls[field.key].invalid && form.controls[field.key].touched ? 'field-error-' + field.id : null"></textarea> }
            @case ('select') { <select class="mt-1 w-full rounded-lg border border-border px-3 py-2" [formControlName]="field.key" [attr.aria-invalid]="form.controls[field.key].invalid && form.controls[field.key].touched" [attr.aria-describedby]="form.controls[field.key].invalid && form.controls[field.key].touched ? 'field-error-' + field.id : null"><option value="">בחירה</option>@for (option of field.options; track option) { <option [value]="option">{{ option }}</option> }</select> }
            @default { <input class="mt-1 w-full rounded-lg border border-border px-3 py-2" [formControlName]="field.key" [type]="field.type" [attr.aria-invalid]="form.controls[field.key].invalid && form.controls[field.key].touched" [attr.aria-describedby]="form.controls[field.key].invalid && form.controls[field.key].touched ? 'field-error-' + field.id : null" /> }
          }
          @if (form.controls[field.key].invalid && form.controls[field.key].touched) { <span [id]="'field-error-' + field.id" class="mt-1 block text-xs text-danger" role="alert">שדה חובה</span> }
        </label>
      }
      <button class="rounded-lg bg-primary px-5 py-2 font-medium text-primary-foreground hover:bg-primary-hover disabled:cursor-not-allowed disabled:bg-disabled disabled:text-disabled-foreground disabled:opacity-100" type="submit" [disabled]="isSubmitting()" [attr.aria-busy]="isSubmitting()">{{ isSubmitting() ? 'שולח…' : 'שליחת הרשמה' }}</button>
    </form>
  }
  @if (message(); as message) { <p class="mt-5 rounded-xl border border-border bg-surface-muted p-4 text-text" role="status">{{ message }}</p> }
</main>
